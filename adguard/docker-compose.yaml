name: adguard

# Un seul AdGuard Home pour les deux voies.
#
# Le filtre n est pas dans les exit nodes. Un exit node relaie des paquets IP et
# n interprete jamais le DNS. Le filtrage se fait a la couche DNS, qui est
# independante du choix d exit node fait dans l app.
#
# Pourquoi ce marche fonctionne, et pourquoi il ne touche pas les deux voies :
# la regle de routage "to 100.64.0.0/10" est plus specifique que la route par
# defaut 0.0.0.0/0 de l exit node. Une requete DNS vers l IP tailnet d AdGuard
# part donc par le tailnet, vers ce service, quel que soit l exit node choisi.
# Aucune regle n est ecrite dans l espace reseau de <OLD-NODE-EXIT-NYMVPN>, ni dans le netns
# host de <OLD-SERVER-NAME>.

services:
  # tailscaled en conteneur compagnon. Il donne au service une IP tailnet stable
  # et porte le choix de sortie pour le trafic amont d AdGuard.
  #
  # TS_ACCEPT_DNS=false est obligatoire. Sinon le service resout son propre
  # amont via le tailnet, le tailnet renvoie la requete vers ce meme service, et
  # la boucle ne se ferme jamais. C est la reponse a la question ouverte de
  # todo.md sur --accept-dns.
  #
  # --accept-routes=true est obligatoire pour la meme raison que sur les
  # microservices : sans lui, la route 0.0.0.0/0 de l exit node est ignoree et
  # "tailscale set --exit-node" reste sans effet.
  tailscale:
    image: local/tailscale-nft:1.102.5
    container_name: adguard-tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - state:/var/lib/tailscale
    environment:
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--accept-routes=true --hostname=adguard
    restart: unless-stopped

  # network_mode service:tailscale partage le netns du sidecar. AdGuard ecoute
  # donc sur 0.0.0.0:53 dans ce netns, dont l IP tailnet.
  #
  # Aucun port publie. Le port 53 sur l hote n a aucun usage ici et le publier
  # exposerait le filtre a tout le reseau local. Le seul chemin d acces est
  # l IP tailnet.
  adguard:
    # Epinglee par digest, version v0.107.79 relevee le 2026-10-05.
    image: adguard/adguardhome@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    container_name: adguard
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    volumes:
      - work:/opt/adguardhome/work
      - conf:/opt/adguardhome/conf
    restart: unless-stopped

volumes:
  state:
  work:
  conf:
